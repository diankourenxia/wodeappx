name: Install smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to test (e.g., v1.0.3)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wodeappx-install-smoke
  cancel-in-progress: true

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_number: ${{ steps.resolve.outputs.version_number }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(gh release list -R diankourenxia/wodeappx --limit 1 --exclude-drafts --exclude-pre-releases | awk '{print $1}' | head -1)"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Failed to resolve version" >&2
            exit 1
          fi
          VERSION_NUMBER="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Testing version: $VERSION ($VERSION_NUMBER)"

  windows:
    name: Windows NSIS install + hello
    needs: resolve-version
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}
        run: |
          gh release download $env:VERSION -R diankourenxia/wodeappx -p "wodeappx-win-x64-$env:VERSION_NUMBER.exe" --dir "$env:RUNNER_TEMP\qa"
          Get-ChildItem "$env:RUNNER_TEMP\qa" | Format-Table Name, Length

      - name: Silent install
        shell: pwsh
        env:
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "qa\wodeappx-win-x64-$env:VERSION_NUMBER.exe"
          Unblock-File $exe
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "NSIS exit $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          Get-Process | Where-Object { $_.Name -match "WodeAppX|wodeappx|OpenWork|openwork" } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Find installed exe
        id: find
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\WodeAppX\WodeAppX.exe",
            "$env:LOCALAPPDATA\Programs\wodeappx\WodeAppX.exe",
            "$env:LOCALAPPDATA\Programs\@openworkdesktop\WodeAppX.exe",
            "$env:ProgramFiles\WodeAppX\WodeAppX.exe",
            "${env:ProgramFiles(x86)}\WodeAppX\WodeAppX.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs","$env:ProgramFiles" -Recurse -Filter "WodeAppX.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $found) { throw "WodeAppX.exe not found after NSIS install" }
          "exe=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "installed $found"

      - name: Isolated launch, First Mile key, hello
        shell: pwsh
        env:
          WODEAPPX_EXE: ${{ steps.find.outputs.exe }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if (-not $env:DEEPSEEK_API_KEY) { throw "DEEPSEEK_API_KEY secret missing" }
          $qa = Join-Path $env:RUNNER_TEMP "wodeappx-win-qa"
          New-Item -ItemType Directory -Force -Path "$qa\home\.wodeapp","$qa\userdata","$qa\report" | Out-Null
          $keys = @{
            schemaVersion = 1
            variables = @(@{ key = "DEEPSEEK_API_KEY"; value = $env:DEEPSEEK_API_KEY })
          } | ConvertTo-Json -Compress
          Set-Content -Path "$qa\home\.wodeapp\keys.json" -Value $keys -Encoding utf8
          $env:USERPROFILE = "$qa\home"
          $env:HOME = "$qa\home"
          $env:APPDATA = "$qa\home\AppData\Roaming"
          $env:LOCALAPPDATA = "$qa\home\AppData\Local"
          $env:WODEAPP_CONFIG_DIR = "$qa\home\.wodeapp"
          $env:OPENWORK_ENV_STORE = "$qa\home\.wodeapp\keys.json"
          $env:OPENWORK_ELECTRON_USERDATA = "$qa\userdata"
          $env:OPENWORK_ELECTRON_REMOTE_DEBUG_PORT = "9833"
          $env:ELECTRON_EXTRA_LAUNCH_ARGS = "--disable-gpu"
          $env:WODEAPPX_DISABLE_SELF_EVOLVE_WORKSPACES = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          $log = "$qa\report\electron.log"
          $proc = Start-Process -FilePath $env:WODEAPPX_EXE -ArgumentList "--disable-gpu" -PassThru -RedirectStandardOutput $log -RedirectStandardError "$qa\report\electron.err.log"
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            if ($proc.HasExited) { throw "app exited $($proc.ExitCode); $(Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40)" }
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:9833/json/version" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "CDP up after ${i}s"; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw "CDP did not come up. log=$(Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40)" }
          $list = [string](python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:9833/json/list', timeout=3).read().decode())")
          Set-Content -Path "$qa\report\cdp-list.json" -Value $list
          Write-Host $list
          if ($list -notlike '*WodeAppX*') { throw "CDP list missing WodeAppX title: $list" }
          python scripts/gha-packaged-hello.py
          if ($LASTEXITCODE -ne 0) { throw "packaged hello failed" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.Name -match "WodeAppX|wodeappx|opencode" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "WINDOWS_INSTALL_QA_PASS"

  linux:
    name: Linux AppImage extract
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxshmfence1 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2

      - name: Download AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          gh release download "$VERSION" -R diankourenxia/wodeappx -p "wodeappx-linux-x86_64-${VERSION_NUMBER}.AppImage" --dir "$RUNNER_TEMP/qa"
          ls -lh "$RUNNER_TEMP/qa"

      - name: Extract, launch, CDP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}
        run: |
          set -euo pipefail
          QA="$RUNNER_TEMP/wodeappx-linux-qa"
          mkdir -p "$QA/home" "$QA/userdata" "$QA/extract" "$QA/report"
          chmod +x "$RUNNER_TEMP/qa/wodeappx-linux-x86_64-${VERSION_NUMBER}.AppImage"
          (cd "$QA/extract" && "$RUNNER_TEMP/qa/wodeappx-linux-x86_64-${VERSION_NUMBER}.AppImage" --appimage-extract)
          BIN="$(find "$QA/extract/squashfs-root" -maxdepth 3 -type f \( -name WodeAppX -o -name wodeappx -o -name '@openworkdesktop' \) -perm -u+x | head -1)"
          test -n "$BIN"
          echo "bin=$BIN"
          file "$BIN"
          export HOME="$QA/home"
          export XDG_CONFIG_HOME="$QA/home/.config"
          export OPENWORK_ELECTRON_USERDATA="$QA/userdata"
          export OPENWORK_ELECTRON_REMOTE_DEBUG_PORT=9833
          export ELECTRON_EXTRA_LAUNCH_ARGS="--disable-gpu --no-sandbox --disable-dev-shm-usage"
          export WODEAPPX_DISABLE_SELF_EVOLVE_WORKSPACES=1
          xvfb-run -a -s "-screen 0 1400x900x24" "$BIN" --no-sandbox --disable-gpu --disable-dev-shm-usage \
            >"$QA/report/electron.log" 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            if ! kill -0 "$PID" 2>/dev/null; then
              tail -n 80 "$QA/report/electron.log"
              exit 1
            fi
            if curl -sf http://127.0.0.1:9833/json/version >/dev/null; then
              echo "CDP up after ${i}s"
              for j in $(seq 1 30); do
                LIST="$(curl -sf http://127.0.0.1:9833/json/list || true)"
                echo "$LIST" > "$QA/report/cdp-list.json"
                if echo "$LIST" | grep -Eiq 'WodeAppX|wodeappx'; then
                  echo "$LIST"
                  kill "$PID" || true
                  echo LINUX_INSTALL_QA_PASS
                  exit 0
                fi
                sleep 1
              done
              echo "$LIST"
              echo "CDP page title not ready"
              kill "$PID" || true
              exit 1
            fi
            sleep 1
          done
          tail -n 80 "$QA/report/electron.log"
          kill "$PID" || true
          exit 1
