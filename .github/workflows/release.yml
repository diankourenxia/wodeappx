name: Release

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor
        required: true
        default: oss
        type: choice
        options: [oss, cloud]
      platform:
        description: Which installers to build
        required: true
        default: windows
        type: choice
        options: [windows, linux, macos, all]
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: wodeappx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version v$VERSION." >&2
            exit 1
          fi
      - run: pnpm open-source:check
      - run: pnpm openwork:bootstrap
      - run: pnpm openwork:patch
      - run: pnpm release:check
      - id: matrix
        run: |
          platform="${{ github.event.inputs.platform }}"
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || -z "$platform" || "$platform" == "all" ]]; then
            platform=all
          fi
          case "$platform" in
            windows)
              echo 'matrix=[{"os":"windows-latest","name":"Windows","artifact":"wodeappx-windows","electron_args":"--win --x64","capture_targets":"x86_64-pc-windows-msvc"}]' >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'matrix=[{"os":"ubuntu-latest","name":"Linux","artifact":"wodeappx-linux","electron_args":"--linux --x64","capture_targets":"x86_64-unknown-linux-gnu"}]' >> "$GITHUB_OUTPUT"
              ;;
            macos)
              echo 'matrix=[{"os":"macos-14","name":"macOS","artifact":"wodeappx-macos","electron_args":"--mac --arm64","capture_targets":"aarch64-apple-darwin"}]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix=[{"os":"macos-14","name":"macOS","artifact":"wodeappx-macos","electron_args":"--mac --arm64","capture_targets":"aarch64-apple-darwin"},{"os":"windows-latest","name":"Windows","artifact":"wodeappx-windows","electron_args":"--win --x64","capture_targets":"x86_64-pc-windows-msvc"},{"os":"ubuntu-latest","name":"Linux","artifact":"wodeappx-linux","electron_args":"--linux --x64","capture_targets":"x86_64-unknown-linux-gnu"}]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: capture-engine/go.sum
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm libfuse2 || sudo apt-get install -y libarchive-tools rpm libfuse2t64
      - name: Materialize source
        run: |
          pnpm openwork:bootstrap
          pnpm openwork:patch
          if [[ "${{ github.event.inputs.flavor || 'oss' }}" == "cloud" ]]; then pnpm openwork:patch-cloud; fi
      - name: Install dependencies
        working-directory: vendor/openwork
        run: |
          for attempt in 1 2 3; do
            if pnpm install --no-frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt ${attempt}), retrying..."
            sleep 15
          done
          exit 1
      - name: Verify contracts
        run: |
          pnpm release:check
          pnpm test:agent-capabilities
      - name: Generate dependency license inventory
        run: node scripts/generate-license-inventory.mjs
      - name: Build desktop application
        working-directory: vendor/openwork
        run: pnpm --filter @openwork/desktop build:electron
      - name: Build capture sidecars
        env:
          CAPTURE_TARGETS: ${{ matrix.capture_targets }}
        run: |
          for target in $CAPTURE_TARGETS; do TARGET="$target" node scripts/build-capture-engine.mjs; done
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.capture_targets }}
      - name: Build browser native-host
        env:
          CAPTURE_TARGETS: ${{ matrix.capture_targets }}
        run: |
          for target in $CAPTURE_TARGETS; do
            node scripts/build-browser-native-host.mjs --target "$target"
          done
      - name: Pack self-evolve source bundle
        run: pnpm pack:self-evolve-source
      - name: Package installers
        working-directory: vendor/openwork/apps/desktop
        env:
          # Windows Authenticode only. Empty secrets → electron-builder skips signing.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -n "${WIN_CSC_LINK}" ]]; then
              echo "Windows Authenticode secrets present; electron-builder will sign."
            else
              echo "WIN_CSC_LINK unset; Windows installer will be unsigned."
            fi
          fi
          pnpm exec electron-builder --config electron-builder.yml ${{ matrix.electron_args }} --publish never
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release
          find vendor/openwork/apps/desktop/dist-electron -maxdepth 1 -type f \
            \( -name "wodeappx-*.dmg" -o -name "wodeappx-*.exe" -o -name "wodeappx-*.AppImage" \
               -o -name "wodeappx-*.tar.gz" -o -name "*.blockmap" -o -name "latest*.yml" \
               -o -name "latest*.yaml" \) \
            -exec cp {} release/ \;
          ls -lh release
          test "$(find release -type f | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload packages to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-packages-${{ needs.validate.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --latest=false \
              --title "WodeAppX ${{ needs.validate.outputs.version }} CI packages" \
              --notes "workflow_dispatch installers (private repo). Not a product tag release. Actions artifact quota is bypassed here." || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" release/* --clobber

  publish:
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wodeappx-*
          path: release
          merge-multiple: true
      # IMPORTANT: Do NOT upload CI-built macOS DMGs to product tags.
      # Product Mac ARM/Intel DMGs are packed and notarized on the founder's Mac,
      # then uploaded manually BEFORE this workflow runs. CI must never clobber them.
      - name: Remove macOS DMGs from CI artifacts
        run: |
          echo "Removing CI-built macOS DMGs to preserve manually uploaded notarized versions..."
          rm -fv release/wodeappx-mac*.dmg release/latest-mac.yml release/latest-mac.yaml 2>/dev/null || true
          find release -name "*.dmg.blockmap" -type f -delete -print 2>/dev/null || true
          echo "Remaining files for tag release:"
          ls -lh release/ || echo "No files remaining"
      - uses: softprops/action-gh-release@v2
        with:
          name: WodeAppX ${{ needs.validate.outputs.version }}
          files: release/*
          fail_on_unmatched_files: false
          generate_release_notes: true
