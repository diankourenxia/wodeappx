name: Bug report
description: Report a reproducible WodeAppX problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, tokens, private workspace content, or undisclosed vulnerabilities. Use Security Advisories for security reports.
  - type: input
    id: version
    attributes:
      label: WodeAppX version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS arm64, macOS x64, Windows x64, Linux x64, Source build]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sanitized logs or context
