name: Feature request
description: Propose a workflow, Skill, model-routing, connector, or desktop improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the complete workflow and where it currently breaks down.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Models, tools, data, and permissions involved
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
