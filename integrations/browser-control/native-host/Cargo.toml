[package]
name = "wodeappx-browser-native-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Chrome Native Messaging bridge for WodeAppX Browser Control"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
